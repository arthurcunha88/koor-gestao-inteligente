/* KOOR / EDIÇÃO EDITORIAL 02
   Um projeto com hierarquia de leitura, não uma coleção de componentes de SaaS.
   Paleta estritamente limitada aos quatro tokens da marca. */
:root{--koor-header-h:114px;--ease:cubic-bezier(.22,1,.36,1)}
html{scroll-padding-top:calc(var(--koor-header-h) + 80px)}
body{font-optical-sizing:auto}
.site-header{backdrop-filter:none;background:var(--paper)}
.top-strip{font-size:10px;letter-spacing:.055em}
.main-nav .nav-btn{transition:opacity .16s var(--ease)}
.nav-btn:hover{opacity:.68}
.nav-btn:active,.header-tool:active,.solid-link:active{transform:translateY(1px)}
.chapter-nav{top:var(--koor-header-h)}
.micro{letter-spacing:.09em}
.kicker{letter-spacing:.075em;font-size:11px}
.kicker:before{width:13px}
/* Motion is opt-in only after JS verifies IntersectionObserver and user motion preferences.
   Without JS, all article sections remain legible and visible. */
.first-in{opacity:0;transform:translate3d(0,13px,0);animation:koor-intro .65s var(--ease) both;animation-delay:var(--delay,0ms)}
@keyframes koor-intro{to{opacity:1;transform:translate3d(0,0,0)}}
[data-reveal]{opacity:1;transform:none;transition:none}
.motion-enabled [data-reveal]:not(.shown){opacity:0;transform:translate3d(0,16px,0)}
.motion-enabled [data-reveal]{transition:opacity .66s var(--ease),transform .66s var(--ease)}
@media(prefers-reduced-motion:reduce){.first-in{animation:none!important;opacity:1!important;transform:none!important}.motion-enabled [data-reveal],.motion-enabled [data-reveal]:not(.shown){opacity:1!important;transform:none!important;transition:none!important}}
/* Hero: one confident idea, brand as an actual editorial anchor. */
.home-hero{grid-template-columns:minmax(0,1.14fr) minmax(360px,.86fr);min-height:640px}
.home-left{padding:77px clamp(30px,4vw,68px) 45px 0;justify-content:space-between;gap:40px}
.hero-overline{font:500 11px/1.5 var(--mono);letter-spacing:.055em;max-width:35ch;color:var(--accent);margin:0}
.home-title{font-size:clamp(72px,7.8vw,123px);max-width:10ch;margin:0;line-height:.94;letter-spacing:-.055em;text-wrap:balance}
.home-title em{color:var(--accent)}
.home-intro{gap:25px;align-items:flex-end;padding:0}
.home-intro p{max-width:360px;font-size:16px;line-height:1.63}
.solid-link{position:relative;overflow:hidden;white-space:nowrap;transition:transform .22s var(--ease),opacity .22s var(--ease)}
.solid-link:hover{transform:translate3d(0,-2px,0);background:var(--ink)}
.home-right{padding:30px 32px 34px;min-height:640px}
.home-right-top{border-bottom:1px solid rgba(250,246,241,.26);padding-bottom:17px}
.hero-emblem{display:flex;flex:1;min-height:280px;position:relative;align-items:center;justify-content:center}
.hero-logo{width:min(76%,380px);height:auto;aspect-ratio:1;opacity:.98}
.hero-emblem-caption{position:absolute;bottom:20px;left:4px;font:400 13px/1.5 var(--mono);letter-spacing:0;opacity:.75}
.home-right-bottom{grid-template-columns:1fr auto;gap:25px;align-items:end}
.home-right-bottom strong{font-size:clamp(27px,2.45vw,38px);line-height:1.04}
.hero-side-link{font:500 12px var(--body);white-space:nowrap;display:inline-flex;align-items:center;gap:8px;border-bottom:1px solid currentColor;padding-bottom:9px;transition:opacity .18s var(--ease)}
.hero-side-link:hover{opacity:.7}
/* Useful entry guide replaces manufactured statistics. */
.entry-intro{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(230px,.75fr);gap:50px;align-items:end;padding:60px 0 24px}
.section-eyebrow{font:500 12px/1.4 var(--body);letter-spacing:0;color:var(--accent);display:inline-block;border-left:2px solid var(--accent);padding-left:12px}
.entry-intro h2{font:400 clamp(35px,4.3vw,62px)/1 var(--display);letter-spacing:-.04em;margin:16px 0 0;max-width:16ch}
.entry-intro p{font-size:14px;line-height:1.8;max-width:48ch;opacity:.83;margin:0}
.entry-table{border-top:1px solid var(--border);border-bottom:1px solid var(--border)}
.entry-row{display:grid;grid-template-columns:54px minmax(0,1.15fr) minmax(220px,.9fr) 25px;align-items:center;gap:27px;padding:23px 13px 23px 0;border-bottom:1px solid var(--border);transition:opacity .18s var(--ease);min-height:100px}
.entry-row:last-child{border-bottom:0}
.entry-row:hover{background:var(--sand)}
.entry-n{font:400 13px var(--mono);opacity:.6}
.entry-question{font:400 clamp(21px,2vw,30px)/1.05 var(--display);letter-spacing:-.025em;max-width:29ch}
.entry-answer strong{display:block;font-size:13px;font-weight:650;margin-bottom:5px}
.entry-answer small{display:block;max-width:46ch;font-size:12px;line-height:1.5;opacity:.73}
.entry-arrow{display:inline-flex;justify-content:flex-end}
/* Apply craft to existing modules, avoid universal cards. */
.module-card{transition:opacity .2s var(--ease)}
.module-card:not(.featured):hover{background:var(--sand)}
.module-card.featured{background:var(--sand)}
.module-card-feature{opacity:.5}
.module-card .card-summary{opacity:.8}
.module-card .card-foot{font-family:var(--body);font-size:11px;letter-spacing:0;text-transform:none}
.block-head p{font-size:14px;line-height:1.75;max-width:340px}
/* References as a reading index, not three clone cards. */
.reading-index{margin-top:42px;border-top:1px solid var(--border)}
.reading-row{display:grid;grid-template-columns:minmax(175px,.65fr) minmax(0,1.15fr) minmax(225px,1fr);gap:36px;border-bottom:1px solid var(--border);padding:33px 6px 36px 0;align-items:start}
.reading-meta span{display:block;font-weight:650;font-size:14px;line-height:1.5}
.reading-meta small{display:block;font-size:12px;line-height:1.6;margin-top:8px;opacity:.73}
.reading-row h3{font:400 clamp(29px,3vw,47px)/.99 var(--display);letter-spacing:-.035em;margin:0;max-width:15ch}
.reading-note{display:flex;flex-direction:column;gap:20px}
.reading-note p{font-size:14px;line-height:1.7;margin:0}
.reading-note a{font-size:12px;font-weight:650;border-bottom:1px solid currentColor;width:max-content;display:inline-flex;align-items:center;gap:8px;padding-bottom:5px}
/* Emphasis: content over metadata. */
.topic-section-head h2{font-size:clamp(40px,4.65vw,66px);line-height:1.01;max-width:14ch}
.topic-section-head p{margin-top:26px}
.page-title{font-size:clamp(67px,7.2vw,112px)}
.page-side{justify-content:space-around}
.page-side .side-context{font:600 11px var(--body);border-bottom:1px solid var(--border);padding-bottom:13px;letter-spacing:.025em}
.page-side .side-label{font:500 15px var(--body);line-height:1.3}
.page-side .side-label strong{font:400 75px/.85 var(--display);letter-spacing:-.04em;display:block;margin-bottom:10px}
.page-intro .micro{letter-spacing:.075em}
.quote-kicker{font:500 12px var(--body);letter-spacing:.02em;opacity:.76}
.quote-bottom .subline{max-width:49ch}
.chapter-nav a{transition:opacity .19s var(--ease)}
/* Feedback with clear boundaries, no needless movement. */
.scenario-option,.lab-select,.mini-button,.outline-link,.footer-links button,.footer-links a{transition:opacity .19s var(--ease),transform .19s var(--ease)}
.module-card:focus-visible,.entry-row:focus-visible,.reading-note a:focus-visible{outline:2px solid var(--accent);outline-offset:-4px}
@media(max-width:1120px){.home-title{font-size:clamp(68px,8.1vw,109px)}.home-intro{flex-direction:column;align-items:flex-start}.reading-row{gap:24px;grid-template-columns:.65fr 1fr 1fr}}
@media(max-width:800px){
  .home-hero{min-height:unset}
  .home-left{min-height:520px;padding:65px 0 45px;gap:28px}
  .home-title{font-size:clamp(65px,11vw,93px);max-width:12ch}
  .home-right{min-height:430px}
  .hero-emblem{min-height:260px}
  .hero-logo{width:min(55%,290px)}
  .entry-intro{grid-template-columns:1fr;gap:16px;padding-top:54px}
  .entry-table{margin-bottom:0}
  .entry-row{grid-template-columns:36px minmax(0,1fr) 25px;gap:16px}
  .entry-answer{grid-column:2;grid-row:2}
  .entry-arrow{grid-column:3;grid-row:1/3;align-self:center}
  .reading-row{grid-template-columns:1fr 1.35fr;gap:18px}
  .reading-note{grid-column:2}
  .page-side .side-label strong{font-size:63px}
}
@media(max-width:540px){
  .top-strip{justify-content:center;font-size:9px}
  .home-left{min-height:470px;padding:48px 0 45px;gap:25px}
  .home-title{font-size:clamp(64px,13.2vw,78px);letter-spacing:-.055em;margin:0}
  .home-intro p{font-size:14px}
  .home-right{min-height:365px;padding:22px}
  .hero-logo{width:min(72%,255px)}
  .hero-emblem{min-height:230px}
  .hero-emblem-caption{font-size:10px;bottom:0}
  .home-right-bottom{grid-template-columns:1fr;gap:12px}
  .home-right-bottom strong{font-size:30px}
  .hero-side-link{font-size:12px;width:max-content}
  .entry-intro{padding-top:54px}
  .entry-intro h2{font-size:43px}
  .entry-row{padding:20px 5px 20px 0}
  .entry-question{font-size:26px}
  .entry-answer small{font-size:12px}
  .reading-row{grid-template-columns:1fr;gap:15px;padding:24px 0}
  .reading-row h3{font-size:37px;max-width:none}
  .reading-note{grid-column:1}
  .page-side .side-label strong{font-size:54px}
  .topic-section-head h2{font-size:46px}
}
/* The applications and bibliography read as an annotated index. */
.practice-guidelines{border-top:1px solid var(--border);margin-top:35px}
.guideline-row{display:grid;grid-template-columns:70px minmax(0,1fr) minmax(260px,1.1fr);gap:24px;align-items:start;border-bottom:1px solid var(--border);padding:27px 6px 29px 0}
.guideline-index{font:400 13px var(--mono);opacity:.55}
.guideline-row h3{font:400 39px/1 var(--display);letter-spacing:-.03em;margin:0}
.guideline-row p{margin:5px 0 0;font-size:14px;line-height:1.72;max-width:54ch}
.book-index{border-top:1px solid var(--border)}

 <script>
/* Koor — conteúdo editorial e referências; textos originais elaborados para o hub. */
window.KOOR_DATA = {
  topics: [
    {
      id:'pessoas',num:'01',short:'Pessoas & autonomia',title:'Desenvolver pessoas sem concentrar decisões.',eyebrow:'GESTÃO DE PESSOAS',
      lead:'Uma liderança sólida transforma responsabilidade em capacidade distribuída: direção clara, espaço para decidir e retorno frequente.',
      challenge:'Quando toda escolha depende do líder, o time pode até entregar hoje — mas não aprende a sustentar o amanhã.',
      signal:'O time toma decisões compatíveis com seu domínio e sabe quando pedir apoio.',
      question:'Qual decisão permanece com você apenas porque ainda não criou condições para delegá-la?',
      foundations:[
        {name:'Autonomia se aprende no diálogo',author:'Paulo Freire',work:'Pedagogia da autonomia · 1996',text:'A prática educativa não se reduz à transmissão de respostas. Na liderança, a analogia é criar condições para que cada pessoa explique escolhas, analise consequências e desenvolva julgamento.',apply:'Pergunte “qual alternativa você recomenda e por quê?” antes de oferecer a solução.'},
        {name:'Motivação depende do contexto',author:'Ryan & Deci',work:'Self-determination theory · 2000',text:'Autonomia, competência e vínculo são necessidades relevantes para a motivação autodeterminada. Incentivos e pressão não substituem um ambiente em que a equipe tem espaço e capacidade para agir.',apply:'Defina o resultado esperado, mas permita escolhas reais sobre o caminho.'},
        {name:'Aprender exige segurança para falar',author:'Amy Edmondson',work:'Psychological safety · 1999',text:'Times aprendem melhor quando discordar, perguntar e reconhecer erros não é tratado como ameaça interpessoal. Isso não elimina padrões de qualidade ou responsabilidade.',apply:'Após uma falha, discuta o processo e as evidências antes de procurar culpados.'},
        {name:'Desenvolvimento exige contribuição',author:'Peter Drucker',work:'The Effective Executive · 1967',text:'A eficácia gerencial depende de priorização, contribuição e uso consciente do tempo. Autonomia sem objetivos claros pode se tornar dispersão.',apply:'Delegue entregas com propósito, critério de qualidade e data de revisão.'},
        {name:'O estilo depende da situação',author:'Daniel Goleman',work:'Leadership That Gets Results · 2000',text:'Líderes precisam variar comportamentos conforme necessidade e contexto. Orientar de perto um iniciante não significa retirar permanentemente sua autonomia.',apply:'Ajuste a frequência do acompanhamento à complexidade e ao domínio observável.'}
      ],
      cycle:{name:'Ciclo C-R-I-A',subtitle:'Método editorial Koor — síntese aplicada, não modelo formal dos autores.',steps:[
        ['Compreender','Escute interesses, experiência, bloqueios e condições de trabalho.'],['Referenciar','Defina entrega, autonomia, limites e critério de conclusão.'],['Investir','Ofereça recurso, tempo, orientação e oportunidade de decisão.'],['Avaliar','Reveja resultado, aprendizados e próximo grau de responsabilidade.']]},
      traps:[['Autonomia ≠ abandono','Delegar sem suporte não desenvolve; apenas transfere risco.'],['Confiança ≠ ausência de cobrança','Acompanhar compromissos pode fortalecer a confiança quando critérios são previsíveis.'],['Desenvolver ≠ apenas treinar','Conhecimento só se converte em capacidade quando é aplicado em responsabilidade real.']],
      scenario:{title:'Uma entrega depende sempre de sua aprovação',context:'Uma pessoa experiente pede validação para escolhas simples, atrasando o time.',choices:[
        ['Continue validando tudo para não correr riscos.','A centralização reduz autonomia e cria um gargalo recorrente.'],
        ['Diga que agora ela deve resolver tudo sozinha.','A falta de fronteiras aumenta incerteza e pode elevar erros evitáveis.'],
        ['Estabeleça decisões autônomas, critérios de escalonamento e revisão semanal.','Equilibra espaço de decisão, clareza e apoio; acompanhe se a regra funciona.'] ],best:2},
      plan:[['Dia 1','Mapear uma dependência','Identifique uma decisão que poderia ser descentralizada.'],['Dia 2','Acordar fronteiras','Descreva resultado, restrições e quando escalar.'],['Dia 4','Acompanhar sem tomar o volante','Faça perguntas sobre critérios e evidências.'],['Dia 7','Ampliar ou ajustar','Revise erros, qualidade e próximo passo de autonomia.']],
      metrics:[['Decisões com autonomia','Decisões tomadas no nível combinado, sem retrabalho relevante.','Não premiar decisões precipitadas.'],['Clareza de entregas','Percentual de atividades com responsável, prazo e qualidade definidos.','Medir clareza, não apenas quantidade.'],['Aprendizado aplicado','Exemplos de novas responsabilidades assumidas com sucesso.','Não confundir treinamento concluído com competência.']],
      refs:['freire','ryan-deci','edmondson','drucker','goleman','pipeline']
    },
    {
      id:'comunicacao',num:'02',short:'Comunicação & feedback',title:'Clareza é uma forma de respeito.',eyebrow:'COMUNICAÇÃO E FEEDBACK',
      lead:'Conversas produtivas combinam escuta genuína, fatos verificáveis, expectativas explícitas e compromisso com a próxima ação.',
      challenge:'A maior parte dos ruídos não nasce da falta de palavras, mas de expectativas que nunca foram realmente compartilhadas.',
      signal:'Ao fim da conversa, as pessoas conseguem repetir o acordo com o mesmo significado.',
      question:'Que conversa você está adiando, e qual fato objetivo tornaria sua abordagem mais justa?',
      foundations:[
        {name:'Pergunte antes de interpretar',author:'Edgar H. Schein',work:'Humble Inquiry · 2013',text:'A investigação humilde valoriza perguntas sinceras, especialmente quando há assimetria de autoridade. A intenção é compreender antes de propor respostas.',apply:'Comece com “o que tornou esta entrega difícil?” e escute sem interromper.'},
        {name:'Separe fato, sentimento e pedido',author:'Marshall Rosenberg',work:'Nonviolent Communication',text:'A comunicação não violenta diferencia observações de interpretações e propõe explicitar necessidades e pedidos. Não é evitar assuntos difíceis.',apply:'Troque “você é descomprometido” por “o prazo de terça passou sem atualização”.'},
        {name:'Combine cuidado com franqueza',author:'Kim Scott',work:'Leader to Leader · 2017',text:'Dar atenção à pessoa e desafiar diretamente comportamentos ou resultados são dimensões complementares de feedback, não polos incompatíveis.',apply:'Nomeie o problema sem diminuir quem está envolvido.'},
        {name:'Receber feedback também é uma habilidade',author:'Stone & Heen',work:'Thanks for the Feedback · 2014',text:'O valor de um retorno depende de como ele é interpretado e trabalhado. O líder deve verificar sua própria defensividade e pedir exemplos concretos.',apply:'Pergunte “o que eu deveria fazer diferente na próxima semana?”.'}
      ],
      cycle:{name:'Ciclo C-O-A-C',subtitle:'Síntese operacional Koor a partir dos fundamentos do material original.',steps:[['Contextualizar','Cite os fatos e os acordos anteriores, sem supor intenções.'],['Ouvir','Convide a outra pessoa a descrever o contexto e os obstáculos.'],['Alinhar','Combine resultado, restrições, prazo e padrão de qualidade.'],['Concluir','Confirme o entendimento e registre o ponto de revisão.']]},
      traps:[['Clareza ≠ dureza','Tom agressivo pode obscurecer a mensagem e desestimular perguntas.'],['Feedback ≠ correção de erro','Reconhecimento específico mostra quais comportamentos repetir.'],['Escutar ≠ concordar','Você pode compreender uma justificativa e manter um compromisso necessário.']],
      scenario:{title:'Dois prazos foram perdidos',context:'Uma pessoa não entregou uma atividade em duas ocasiões. A equipe começa a especular sobre a causa.',choices:[['Cobrar publicamente para servir de exemplo.','Pode expor sem compreender as causas e prejudicar a confiança.'],['Evitar o tema para não criar desconforto.','Mantém o problema e transfere incerteza para o resto do time.'],['Conversar em particular com fatos, ouvir obstáculos e fechar um novo acordo.','Preserva a dignidade e produz um compromisso verificável.']],best:2},
      plan:[['Dia 1','Mapear um ruído','Escolha um alinhamento recorrente que não foi nomeado.'],['Dia 2','Conversar com fatos','Use fatos, perguntas e expectativas explícitas.'],['Dia 4','Confirmar entendimento','Peça que a pessoa descreva o próximo passo.'],['Dia 7','Revisar o acordo','Cheque avanços e ajuste as condições necessárias.']],
      metrics:[['Combinados explícitos','Reuniões com responsável, prazo e conclusão definidos.','Não transformar toda conversa em burocracia.'],['Correção de ruídos','Dúvidas essenciais resolvidas antes de executar.','Perguntar é sinal de prudência, não fraqueza.'],['Fechamento de feedbacks','Acordos revisados no momento prometido.','Evitar métrica vazia de quantidade de feedbacks.']],
      refs:['schein','rosenberg','kim','stone-heen','hunter']
    },
    {
      id:'decisoes',num:'03',short:'Decisão & pensamento',title:'Decidir com rigor, mesmo sem certeza.',eyebrow:'DECISÃO E PENSAMENTO CRÍTICO',
      lead:'Uma decisão boa não é aquela que sempre dá certo; é aquela cujo processo torna hipóteses, riscos e critérios discutíveis.',
      challenge:'Pressa, confiança excessiva e informações incompletas costumam parecer convicção — até a realidade contrariá-las.',
      signal:'Critérios são registrados antes da decisão e as hipóteses podem ser revisadas.',
      question:'Em que decisão recente uma hipótese foi tratada como fato?',
      foundations:[
        {name:'Reconheça a racionalidade limitada',author:'Herbert A. Simon',work:'Administrative Behavior · 1947',text:'As pessoas decidem com tempo e informações limitadas. O objetivo não é esperar onisciência, mas tornar explícitas as restrições do processo.',apply:'Declare a informação que falta e estabeleça quando a decisão precisa ocorrer.'},
        {name:'Identifique atalhos cognitivos',author:'Tversky & Kahneman',work:'Science · 1974',text:'Heurísticas ajudam a julgar rapidamente, mas podem introduzir vieses sistemáticos. A impressão inicial não substitui a checagem de evidências.',apply:'Peça uma interpretação alternativa antes da aprovação final.'},
        {name:'Imagine o fracasso antes de agir',author:'Gary Klein',work:'Performing a Project Premortem · 2007',text:'No pré-mortem, o grupo supõe que a iniciativa falhou e levanta razões possíveis. A técnica pode revelar riscos ignorados.',apply:'Pergunte “se isso falhar em um mês, qual terá sido a causa?”.'},
        {name:'Atualize crenças com novas evidências',author:'Tetlock & Gardner',work:'Superforecasting · 2015',text:'Previsões e julgamentos podem melhorar com decomposição, probabilidades e revisão. O líder não precisa defender eternamente a primeira resposta.',apply:'Anote o que faria você mudar de ideia.'}
      ],
      cycle:{name:'Ciclo D-E-C-I',subtitle:'Procedimento prático Koor; não se trata de uma escala acadêmica validada.',steps:[['Definir','Delimite a decisão, os envolvidos e o prazo.'],['Evidenciar','Liste dados, hipóteses e lacunas separadamente.'],['Comparar','Avalie opções por critérios e riscos.'],['Inspecionar','Registre razões e uma data de revisão.']]},
      traps:[['Confiança ≠ competência','Pessoas seguras podem estar mal informadas; evidências importam.'],['Resultado ≠ processo','Uma escolha mal fundamentada pode dar certo por sorte.'],['Rigor ≠ lentidão','Decisões reversíveis pedem menos burocracia que compromissos de alto custo.']],
      scenario:{title:'Um fornecedor precisa ser escolhido hoje',context:'Há três propostas, orçamento limitado e evidências incompletas sobre o prazo de entrega.',choices:[['Escolher o menor preço sem comparar riscos.','Economiza tempo inicial, mas pode ignorar falhas críticas de execução.'],['Adiar indefinidamente até ter certeza completa.','A busca por certeza pode destruir a oportunidade.'],['Comparar critérios essenciais, registrar suposições e definir uma revisão.','Permite agir com limites explícitos e corrigir se surgirem dados novos.']],best:2},
      plan:[['Dia 1','Selecionar uma decisão','Escolha uma decisão real e relevante.'],['Dia 2','Definir critérios','Escreva os fatores que realmente importam.'],['Dia 4','Fazer um pré-mortem','Antecipe três motivos plausíveis de falha.'],['Dia 7','Registrar revisão','Agende uma verificação de resultados e premissas.']],
      metrics:[['Decisões documentadas','Escolhas relevantes com opções, critérios e responsáveis.','Evitar registros para decisões triviais.'],['Hipóteses testadas','Premissas críticas revistas antes ou após agir.','Não confundir quantidade de testes com qualidade.'],['Reversões fundamentadas','Mudanças realizadas com nova evidência documentada.','Mudar de ideia não deve ser automaticamente punido.']],
      refs:['simon','tversky-kahneman','klein','tetlock','sinek']
    },
    {
      id:'conflitos',num:'04',short:'Conflitos & negociação',title:'A discordância pode produzir acordos melhores.',eyebrow:'CONFLITOS E NEGOCIAÇÃO',
      lead:'Conflito produtivo não é ausência de tensão: é capacidade de distinguir pessoas, interesses, responsabilidades e critérios de decisão.',
      challenge:'Quando o problema passa a ser “quem venceu”, a equipe costuma perder acesso ao que realmente precisa resolver.',
      signal:'Os envolvidos conseguem expressar interesses e concordar com critérios verificáveis.',
      question:'Qual disputa em sua equipe está centrada em posições, sem considerar os interesses por trás delas?',
      foundations:[
        {name:'Procure integração de interesses',author:'Mary Parker Follett',work:'Conferências sobre conflito · 1926',text:'Follett enfatiza alternativas que integrem necessidades, em vez de reduzir tudo a domínio de um lado ou compromisso superficial.',apply:'Investigue se existe uma terceira opção que preserve o essencial para ambos.'},
        {name:'Negocie interesses, não apenas posições',author:'Fisher, Ury & Patton',work:'Getting to Yes',text:'A negociação baseada em princípios separa o relacionamento do problema, explora interesses e usa critérios objetivos sempre que possível.',apply:'Pergunte “por que essa condição é importante para você?”.'},
        {name:'Escolha um modo de lidar com o conflito',author:'Thomas & Kilmann',work:'Conflict Mode Instrument',text:'Competir, colaborar, comprometer, evitar e acomodar representam estilos possíveis em circunstâncias distintas; nenhum é universalmente correto.',apply:'Avalie urgência, importância do vínculo e margem de negociação.'},
        {name:'Uma conversa difícil tem camadas',author:'Stone, Patton & Heen',work:'Difficult Conversations',text:'Disputas incluem percepções sobre fatos, sentimentos e identidade. Ignorar uma dessas dimensões pode impedir a resolução.',apply:'Nomeie o problema da entrega sem transformar o debate em julgamento de caráter.'}
      ],

 <script>
/* Koor — apresentação, navegação e interatividade. JavaScript sem dependências. */
(() => {

  const topics = data.topics;

  let memoryProgress = {};
  let memoryChoices = {};
  function countCompleted(t){const ids=readProgress()[t.id]||[];return ids.filter(i=>Number.isInteger(i)&&i>=0&&i<t.plan.length).length;}
  function readProgress(){try{return JSON.parse(localStorage.getItem('koor_progress_v1')||'{}')||{};}catch{return memoryProgress;}}
  function saveProgress(obj){memoryProgress=obj;try{localStorage.setItem('koor_progress_v1',JSON.stringify(obj));}catch{/* Progresso da sessão permanece em memória. */}}

  function saveChoices(obj){memoryChoices=obj;try{localStorage.setItem('koor_choices_v1',JSON.stringify(obj));}catch{}}

  function toast(message){const el=document.querySelector('#toast');el.textContent=message;el.classList.add('show');clearTimeout(toastTimeout);toastTimeout=setTimeout(()=>el.classList.remove('show'),2600);}

    </div></footer>`;
  }
  let revealObserver = null;
  function motion(){
    if(revealObserver){ revealObserver.disconnect(); revealObserver=null; }
    const nodes=[...app.querySelectorAll('[data-reveal]')];
    const reduced=window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    if(reduced || !('IntersectionObserver' in window)){
      nodes.forEach(node=>node.classList.add('shown'));
      return;
    }
    revealObserver=new IntersectionObserver(entries=>{
      entries.forEach(entry=>{
        if(!entry.isIntersecting)return;
        entry.target.classList.add('shown');
        revealObserver?.unobserve(entry.target);
      });
    },{threshold:0.01,rootMargin:'0px 0px 65px 0px'});
    nodes.forEach(node=>{
      if(node.getBoundingClientRect().top < window.innerHeight + 50){node.classList.add('shown');}
      else {revealObserver.observe(node);}
    });
  }

      <div class="reading-index">${data.lenses.map((l,i)=>`<article class="reading-row" data-reveal><div class="reading-meta"><span>${ESC(l.author)}</span><small>${l.year} · ${ESC(l.name)}</small></div><h3>${ESC(l.question)}</h3><div class="reading-note"><p>${ESC(l.argument)}</p><a href="#biblioteca">Ver referência ${arrow}</a></div></article>`).join('')}</div></div></section>
    <section class="block-section shell"><div class="block-head" data-reveal><div>${label('Da ideia à conduta')}<h2 class="serif section-title">Gestão aparece na forma como você conduz o cotidiano.</h2></div><p>O contraste abaixo não classifica pessoas. Ele mostra como pequenas decisões gerenciais alteram a qualidade do trabalho coletivo.</p></div><div class="comparison-strip">${[['Liderar tudo sozinho','Concentrar a decisão, corrigir tarde e gerar dependência.'],['Organizar o trabalho em conjunto','Explicitar critérios, distribuir responsabilidade e revisar com método.']].map(([h,p],i)=>`<article class="compare-card" data-reveal><span class="micro">${i===0?'Risco frequente':'Condução desejável'}</span><h3>${h}</h3><p>${p}</p></article>`).join('')}</div></section>

  function indexView(){return home();}

      <section class="topic-section shell" id="fundamentos">${sectionHeading('01','Ideias para pensar e agir.','Os conceitos abaixo são interpretações didáticas das obras citadas. Eles servem como lentes de julgamento, não como fórmulas universais.')}
        <div class="foundation-list">${t.foundations.map((f,i)=>`<article class="foundation-item" data-reveal><span class="f-number">${String(i+1).padStart(2,'0')}</span><div><h3 class="foundation-name">${ESC(f.name)}</h3><div class="foundation-author">${ESC(f.author)}<br>${ESC(f.work)}</div></div><div class="foundation-description-wrap"><p class="foundation-description">${ESC(f.text)}</p><div class="foundation-apply"><b>Na prática</b>${ESC(f.apply)}</div></div></article>`).join('')}</div>
      </section>

        <div class="cycle-header" data-reveal><span class="cycle-name">${ESC(t.cycle.name)}</span><p class="subline body-muted">${ESC(t.cycle.subtitle)}</p></div><div class="cycle-steps">${t.cycle.steps.map(([h,d],i)=>`<div class="cycle-step" data-reveal><span class="cycle-index">Etapa ${i+1}</span><h3>${ESC(h)}</h3><p>${ESC(d)}</p></div>`).join('')}</div>
      </section>
      <section class="topic-section shell" id="contrapontos">${sectionHeading('03','Quando uma boa ideia vira um erro.','Nenhum princípio funciona bem se aplicado sem contexto. Estes contrastes ajudam a reconhecer exageros comuns.')}
      <div class="trap-list">${t.traps.map(([h,d],i)=>`<article class="trap-card" data-reveal><span class="micro">Cuidado de aplicação</span><h3>${ESC(h)}</h3><p>${ESC(d)}</p></article>`).join('')}</div></section>
      <section class="topic-section shell" id="caso">${sectionHeading('04','O julgamento começa no caso.','Escolha uma abordagem e observe suas consequências prováveis. O exercício não é teste de perfil nem oferece respostas universais.')}
      <div class="scenario" data-reveal><div class="scenario-intro"><span class="micro">Situação para analisar</span><div><h3>${ESC(t.scenario.title)}</h3><p>${ESC(t.scenario.context)}</p></div><span class="micro">Discuta as alternativas</span></div><div class="scenario-body"><span class="micro">Qual caminho você adotaria?</span><div class="scenario-options">${t.scenario.choices.map(([text],i)=>`<button class="scenario-option ${selected===i?'chosen':''}" data-scenario="${t.id}" data-choice="${i}" aria-pressed="${selected===i}"><span class="scenario-letter">${['A','B','C'][i]}.</span><span>${ESC(text)}</span></button>`).join('')}</div><div id="scenario-feedback-${t.id}" aria-live="polite">${selected!==undefined?feedbackMarkup(t,selected):''}</div></div></div>
      </section>
      <section class="topic-section shell" id="aplicacao">${sectionHeading('05','Uma semana para começar.','Uma sequência curta, deliberadamente pequena. Marque o que foi realmente feito e use o registro como memória de prática.')}

      <section class="topic-section shell" id="indicadores">${sectionHeading('06','O que observar.','Indicadores são pontos de atenção para revisar processos. Não devem ser usados isoladamente para classificar o valor de pessoas.')}
        <div data-reveal><table class="data-table"><thead><tr><th>Indicador sugerido</th><th>Como observar</th><th>Cuidado de interpretação</th></tr></thead><tbody>${t.metrics.map(([a,b,c])=>`<tr><td>${ESC(a)}</td><td>${ESC(b)}</td><td>${ESC(c)}</td></tr>`).join('')}</tbody></table></div>
      </section>
      <section class="topic-section shell" id="fontes">${sectionHeading('07','As ideias têm origem.','As referências são registros bibliográficos, artigos ou páginas de editoras. Os textos deste hub são paráfrases e aplicações originais.')}
       <div class="foundation-list">${sources.map((s,i)=>`<div class="reference-mini" data-reveal><div><span class="micro">${ESC(s.type.toUpperCase())}</span><div style="font:400 27px/1.2 var(--display);margin-top:9px">${ESC(s.title)}</div><small style="font-size:12px;opacity:.7">${ESC(s.author)} ${s.year?'· '+ESC(s.year):''}</small></div><a href="${ESC(s.url)}" target="_blank" rel="noopener noreferrer">Consultar fonte ${arrow}</a></div>`).join('')}</div>
      </section>
      <div class="topic-next"><button data-route="trilha/${prev.id}"><span class="micro">Tema anterior</span><span class="next-title">${ESC(prev.short)}</span></button><button data-route="trilha/${next.id}"><span class="micro">Próximo tema</span><span class="next-title">${ESC(next.short)}</span></button></div>`;
  }
  function feedbackMarkup(t,choice){const right=choice===t.scenario.best;return `<div class="scenario-feedback"><strong>${right?'Abordagem mais consistente neste cenário':'Ponto de atenção nesta abordagem'}</strong><p>${ESC(t.scenario.choices[choice][1])}</p></div>`;}
  function renderPlanAside(t){let n=countCompleted(t);let pct=Math.round(n/t.plan.length*100);return `<span class="micro">PROGRESSO DE PRÁTICA</span><div class="big-percent">${pct}%</div><div class="progress-rail" role="progressbar" aria-label="Progresso da prática" aria-valuemin="0" aria-valuemax="100" aria-valuenow="${pct}"><div class="progress-fill" style="transform:scaleX(${pct/100})"></div></div><p>${n} de ${t.plan.length} ações realizadas. Progresso salvo neste navegador, sem conta e sem envio de dados.</p><div class="plan-buttons"><button class="mini-button" data-copy-plan="${t.id}">Copiar plano</button><button class="mini-button" data-reset-plan="${t.id}">Reiniciar</button></div>`;}
  function tracksView(){
    setTitle('Trilhas de liderança');
    return `<div class="shell"><section class="page-intro page-intro-grid page-intro-v3"><div><span class="section-eyebrow first-in">Percurso de estudo</span><h1 class="serif page-title first-in" style="--delay:80ms">Cinco trilhas para ler, aplicar e revisar.</h1><p class="page-summary first-in" style="--delay:160ms">Os temas são independentes, mas se reforçam mutuamente. Você pode entrar por qualquer um deles.</p></div><aside class="page-visual page-visual-compact first-in"><img src="${visuals.workshop}" alt="${visualAlt.workshop}"><p>Progresso simples: cada trilha mostra quantas ações você já registrou neste navegador.</p></aside></section></div>
    <section class="block-section shell"><div class="module-grid module-grid-v3">${topics.map((t,i)=>`<a href="${tLink(t.id)}" class="module-card ${i===0?'featured':''}"><div class="module-thumb"><img src="${topicVisual(t.id)}" alt="${topicVisualAlt(t.id)}"></div><div class="module-card-header"><span class="num">Trilha ${t.num}</span><span class="mini-progress">${countCompleted(t)}/${t.plan.length}</span></div><div><h2 class="card-title">${ESC(t.short)}</h2><p class="card-summary">${ESC(t.lead)}</p></div><div class="card-foot"><span>${countCompleted(t)} ações marcadas</span>${arrow}</div></a>`).join('')}</div></section>
    <section class="home-quote"><div class="shell quote-grid"><span class="quote-kicker">Sugestão de percurso</span><div><blockquote>Comece pelas pessoas.<br>Construa <em>clareza.</em><br>Depois sustente decisões.</blockquote><div class="quote-bottom"><p class="subline">É uma sugestão editorial. Não é um caminho obrigatório.</p><a href="#trilha/pessoas" class="outline-link">Começar pela trilha de pessoas ${arrow}</a></div></div></div></section>`;
  }
  function labToolPanel(){
    if(state.labTool==='delegacao') return `<div class="lab-canvas"><aside class="lab-brief"><div><span class="micro">DELEGAÇÃO</span><h2>Quanto acompanhar?</h2><p>Explore uma heurística simples: quanto menor a clareza ou a experiência observada, maior a necessidade de estrutura e verificação.</p></div><span class="micro">NÃO É TESTE PSICOMÉTRICO</span></aside><div class="lab-panel">
      <div class="field"><label for="deleg-clarity">Clareza do resultado e das regras</label><select id="deleg-clarity" data-tool-field><option value="clara">Clara: resultado, limites e padrão definidos</option><option value="incerta">Incerta: faltam critérios ou responsabilidade</option></select></div>
      <div class="field"><label for="deleg-experience">Domínio demonstrado da pessoa</label><select id="deleg-experience" data-tool-field><option value="iniciante">Iniciante nesta responsabilidade</option><option value="desenvolvendo">Em desenvolvimento</option><option value="experiente">Experiente em tarefas comparáveis</option></select></div>
      <div class="field"><label for="deleg-risk">Custo potencial de uma falha</label><select id="deleg-risk" data-tool-field><option value="baixo">Baixo ou facilmente reversível</option><option value="alto">Alto ou difícil de reverter</option></select></div>
      <div class="tool-output" aria-live="polite"><span class="result-label">ORIENTAÇÃO CONTEXTUAL</span><h3 id="deleg-title"></h3><p id="deleg-text"></p><ul id="deleg-actions"></ul></div><p class="tool-note">Heurística editorial da Koor; adapte à função, segurança, políticas da organização e necessidades reais de quem executa. Não classifica pessoas.</p></div></div>`;
    if(state.labTool==='conversa')return `<div class="lab-canvas"><aside class="lab-brief"><div><span class="micro">PREPARAÇÃO DE FEEDBACK</span><h2>Conversa que produz acordo.</h2><p>Prepare uma reunião curta com observação objetiva, escuta e próximos passos. O texto é gerado somente neste navegador.</p></div><span class="micro">INSUMO PARA UMA CONVERSA REAL</span></aside><div class="lab-panel">
      <div class="field"><label for="talk-context">Situação</label><input id="talk-context" data-tool-field placeholder="Ex.: alinhamento de entregas da equipe"></div>
      <div class="field"><label for="talk-fact">Fato observável (sem julgar intenção)</label><textarea id="talk-fact" data-tool-field placeholder="Ex.: duas entregas ficaram sem atualização até o prazo previsto"></textarea></div>
      <div class="field-grid"><div class="field"><label for="talk-question">Pergunta para ouvir</label><input id="talk-question" data-tool-field placeholder="O que dificultou a entrega?"></div><div class="field"><label for="talk-expectation">Resultado e critério esperado</label><input id="talk-expectation" data-tool-field placeholder="Responsável e prazo de revisão"></div></div>
      <div class="tool-output"><span class="result-label">ROTEIRO GERADO</span><pre id="tool-preview" aria-live="polite"></pre></div><div class="tool-actions"><button class="solid-link" data-copy-preview>Copiar roteiro ${arrow}</button></div><p class="tool-note">Evite registrar dados sensíveis ou avaliações pessoais desnecessárias. O roteiro não substitui escuta nem política institucional.</p></div></div>`;
    return `<div class="lab-canvas"><aside class="lab-brief"><div><span class="micro">REGISTRO DE DECISÃO</span><h2>O raciocínio precisa deixar rastros.</h2><p>Registre alternativas, critérios e a evidência que faria você mudar de ideia antes de executar uma escolha relevante.</p></div><span class="micro">REGISTRO DE DECISÃO · MODELO EDITORIAL</span></aside><div class="lab-panel">
      <div class="field"><label for="decision-object">Decisão em questão</label><input id="decision-object" data-tool-field placeholder="Ex.: fornecedor de um evento"></div>
      <div class="field"><label for="decision-options">Alternativas consideradas</label><input id="decision-options" data-tool-field placeholder="Opção A; opção B; opção C"></div>
      <div class="field-grid"><div class="field"><label for="decision-criteria">Critérios principais</label><textarea id="decision-criteria" data-tool-field placeholder="Custo, prazo, qualidade, reversibilidade"></textarea></div><div class="field"><label for="decision-risk">Hipóteses e riscos a verificar</label><textarea id="decision-risk" data-tool-field placeholder="O que ainda não sabemos?"></textarea></div></div>
      <div class="field"><label for="decision-review">Momento de revisão</label><input id="decision-review" data-tool-field placeholder="Ex.: próxima reunião de acompanhamento"></div>
      <div class="tool-output"><span class="result-label">REGISTRO GERADO</span><pre id="tool-preview" aria-live="polite"></pre></div><div class="tool-actions"><button class="solid-link" data-copy-preview>Copiar registro ${arrow}</button></div><p class="tool-note">Documento de apoio, sem cálculo automático de risco: critérios precisam ser definidos e ponderados pelas pessoas responsáveis.</p></div></div>`;
  }
  function laboratory(){setTitle('Laboratório de liderança');return `<div class="shell"><section class="page-intro page-intro-grid"><div><span class="micro first-in">FERRAMENTAS PARA O COTIDIANO</span><h1 class="serif page-title first-in" style="--delay:80ms">Teoria que cabe na próxima reunião.</h1><p class="page-summary first-in" style="--delay:160ms">Três instrumentos simples para transformar reflexão em prática. Não há pontuação de personalidade, diagnóstico automático nem transmissão das suas respostas.</p></div><aside class="page-side first-in"><span class="side-label"><strong>3</strong> ferramentas de apoio</span><p>Ferramentas sem cadastro e com saída pronta para copiar.</p></aside></section></div>
    <section class="block-section shell">${label('QUAL FERRAMENTA VOCÊ PRECISA?')}<div class="lab-selector" role="tablist" aria-label="Ferramentas do laboratório">${[['delegacao','Delegação & suporte'],['conversa','Roteiro de feedback'],['decisao','Registro de decisão']].map(([id,n],i)=>`<button class="lab-select ${state.labTool===id?'is-active':''}" data-lab="${id}" role="tab" id="tab-${id}" aria-selected="${state.labTool===id}" aria-controls="lab-tool"><b>${n}</b><span>${state.labTool===id?'SELECIONADO':'ABRIR'} ${arrow}</span></button>`).join('')}</div><div id="lab-tool" role="tabpanel" aria-labelledby="tab-${state.labTool}">${labToolPanel()}</div></section>
    <section class="lens-section"><div class="shell"><div class="block-head"><div>${label('COMO USAR COM CRITÉRIO')}<h2 class="serif section-title">A ferramenta não<br><em>substitui o discernimento.</em></h2></div><p>O valor de um método está na qualidade da conversa que ele provoca, não na aparência de precisão.</p></div><div class="practice-guidelines">${[['Contexto','A mesma abordagem pode ser útil em uma tarefa e inadequada em outra.'],['Critério','Uma equipe precisa compreender o que conta como resultado e por quê.'],['Revisão','O que aconteceu precisa ajudar a melhorar o processo, não apenas justificar a escolha inicial.']].map(([h,p],i)=>`<article class="guideline-row" data-reveal><span class="guideline-index">${String(i+1).padStart(2,'0')}</span><h3>${h}</h3><p>${p}</p></article>`).join('')}</div></div></section>`;}
  function updateToolPreview(){
    if(route()!=='laboratorio')return;
    const val=id=>(document.getElementById(id)?.value||'').trim();
    if(state.labTool==='delegacao'){
      const c=val('deleg-clarity'),e=val('deleg-experience'),r=val('deleg-risk');
      let title,text,actions;
      if(c==='incerta'){title='Primeiro, torne a tarefa clara.';text='Sem resultado ou limites definidos, qualquer grau de autonomia fica sujeito a interpretações divergentes.';actions=['Explicitar resultado, restrições e responsável.','Combinar exemplos de qualidade suficiente.','Só então discutir frequência de acompanhamento.'];}
      else if(e==='iniciante'||r==='alto'){title='Delegue com suporte próximo.';text='A responsabilidade pode avançar, mas o custo da falha ou a experiência atual recomendam orientação, marcos intermediários e critérios explícitos.';actions=['Dividir a tarefa em pontos de decisão.','Combinar um checkpoint curto antes do marco crítico.','Retirar etapas de revisão quando houver domínio demonstrado.'];}
      else if(e==='desenvolvendo'){title='Autonomia progressiva, revisões combinadas.';text='Dê espaço para escolhas de execução e mantenha momentos de revisão definidos antes do início.';actions=['Permitir que a pessoa proponha o plano.','Revisar premissas, não cada movimento.','Expandir o escopo após entregas consistentes.'];}
      else{title='Delegue o caminho, acompanhe o resultado.';text='Com critérios claros, baixo risco e experiência comprovada, microgestão tende a adicionar custo sem melhorar o aprendizado.';actions=['Definir a decisão que pode ser tomada sem aprovação.','Combinar sinais de alerta e momento de escalonamento.','Revisar qualidade, aprendizado e oportunidades futuras.'];}
      const $=id=>document.getElementById(id);if($('deleg-title')){ $('deleg-title').textContent=title;$('deleg-text').textContent=text;$('deleg-actions').innerHTML=actions.map(a=>`<li>${ESC(a)}</li>`).join('');}
      return;
    }
    let result='';
    if(state.labTool==='conversa')result=`ROTEIRO DE CONVERSA — KOOR\n\n1. CONTEXTO\n${val('talk-context')||'[Descreva a situação]'}\n\n2. OBSERVAÇÃO VERIFICÁVEL\n${val('talk-fact')||'[Descreva fatos sem atribuir intenção]'}\n\n3. ESCUTA\n${val('talk-question')||'Como você enxerga o que aconteceu? Que obstáculos surgiram?'}\n\n4. EXPECTATIVA E ACORDO\n${val('talk-expectation')||'[Registre resultado esperado, responsável, prazo e critério]'}\n\n5. FECHAMENTO\nConfirme o entendimento e combine o momento de revisão.`;
    else result=`REGISTRO DE DECISÃO — KOOR\n\nDECISÃO\n${val('decision-object')||'[Qual escolha precisa ser feita?]'}\n\nALTERNATIVAS\n${val('decision-options')||'[Liste opções reais, inclusive não agir se relevante]'}\n\nCRITÉRIOS\n${val('decision-criteria')||'[O que importa e como será comparado?]'}\n\nHIPÓTESES / RISCOS\n${val('decision-risk')||'[O que falta saber? O que faria você mudar de ideia?]'}\n\nPONTO DE REVISÃO\n${val('decision-review')||'[Data, evento ou indicador de revisão]'}\n\nNOTA\nEste registro documenta o raciocínio; não garante o resultado.`;
    const preview=document.querySelector('#tool-preview');if(preview)preview.textContent=result;
  }
  function libraryRows(items){return items.map((s,i)=>`<a class="source-row" target="_blank" rel="noopener noreferrer" href="${ESC(s.url)}" aria-label="Consultar ${ESC(s.title)} em fonte externa"><span class="source-index">${String(i+1).padStart(2,'0')}</span><div><h3 class="source-title">${ESC(s.title)}</h3><span class="source-author">${ESC(s.author)}${s.year?' · '+ESC(s.year):''}</span></div><span class="source-type">${ESC(s.type)}<br>${ESC((topic(s.topic)?.short)||'Três lentes')}</span><span class="source-arrow">${arrow}</span></a>`).join('')||`<p style="padding:30px 0">Nenhuma referência encontrada. Ajuste a busca ou os filtros.</p>`;}
  function filterLibrary(){
    const query=state.query.normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();
    const items=data.sources.filter(s=>{
      const src=(s.author+' '+s.title+' '+s.type+' '+(topic(s.topic)?.short||'lentes')).normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();
      return src.includes(query)&&(state.filter==='todos'||s.topic===state.filter)&&(state.kind==='todos'||s.type===state.kind);
    });
    const list=document.getElementById('source-results');if(list)list.innerHTML=libraryRows(items);
    const count=document.getElementById('source-count');if(count)count.textContent=`${items.length} DE ${data.sources.length} REFERÊNCIAS`;
  }
  function modelsDiagram(){
    const transitions=[
      ['Gerir a si mesmo → Gerir outras pessoas','Trocar a execução individual pelo desenvolvimento e coordenação.'],
      ['Gerir pessoas → Gerir gestores','Apoiar quem já conduz outras equipes e resultados.'],
      ['Gerir gestores → Gerir uma função','Integrar capacidades, prioridades e estratégia funcional.'],
      ['Gerir uma função → Gerir um negócio','Assumir decisões integradas de operação e resultados.'],
      ['Gerir um negócio → Gerir um grupo','Coordenar negócios e escolher onde alocar recursos.'],
      ['Gerir um grupo → Gerir uma empresa','Conduzir decisões e valores em escala organizacional.']
    ];
    return `<section class="block-section shell" style="padding-top:8px"><div class="block-head"><div>${label('LEITURA VISUAL')}<h2 class="serif section-title">Três lentes,<br><em>três níveis de análise.</em></h2></div><p>Sinek ajuda a discutir direção; Hunter, a qualidade da relação; Charan, Drotter e Noel, a evolução das responsabilidades.</p></div>
      <div class="models-grid"><article class="model-pane" data-reveal><span class="micro">SIMON SINEK</span><h3>Círculo Dourado</h3><p>O propósito orienta o modo de agir e aquilo que se entrega. É um enquadramento útil para comunicar direção, não uma garantia de desempenho.</p><div class="golden-diagram" role="img" aria-label="Três círculos concêntricos: por quê no centro, como no círculo intermediário e o quê no círculo externo"><div class="golden-ring outer"><span class="ring-label">O QUÊ</span><div class="golden-ring middle"><span class="ring-label">COMO</span><div class="golden-ring inner">POR QUÊ</div></div></div></div><a class="outline-link" href="${ESC(sourceMap.sinek.url)}" target="_blank" rel="noopener noreferrer">Obra de referência ${arrow}</a></article>
      <article class="model-pane ink" data-reveal><span class="micro">JAMES C. HUNTER</span><h3>Poder não é autoridade.</h3><p>A narrativa de Hunter diferencia capacidade de impor condutas da autoridade que se desenvolve com serviço, relação e responsabilidade.</p><div class="model-pair"><div><span class="micro">PODER FORMAL</span><strong>Conseguir obediência.</strong><p>Uma posição pode obrigar a executar, mesmo sem conquistar confiança.</p></div><div><span class="micro">AUTORIDADE</span><strong>Conquistar legitimidade.</strong><p>Coerência, serviço e cuidado fortalecem disposição para cooperar.</p></div></div><p><b>Contraponto:</b> servir também exige estabelecer limites e responsabilizar pelas entregas.</p><a class="outline-link" href="${ESC(sourceMap.hunter.url)}" target="_blank" rel="noopener noreferrer">Obra de referência ${arrow}</a></article>
      <article class="model-pane" style="grid-column:1/-1" data-reveal><div style="display:grid;grid-template-columns:.75fr 1.25fr;gap:40px" class="pipeline-model-grid"><div><span class="micro">CHARAN, DROTTER & NOEL</span><h3>Pipeline de liderança</h3><p>O modelo descreve seis mudanças de responsabilidade. Cada passagem requer habilidades, maneiras de usar o tempo e prioridades diferentes. Em equipes pequenas, as primeiras transições costumam ser mais diretamente aplicáveis.</p><a class="outline-link" href="${ESC(sourceMap.pipeline.url)}" target="_blank" rel="noopener noreferrer">Obra de referência ${arrow}</a></div><div class="pipeline-list">${transitions.map(([h,d],i)=>`<div class="pipeline-item"><span>0${i+1}</span><div><b>${ESC(h)}</b><p>${ESC(d)}</p></div></div>`).join('')}</div></div></article></div>
      <p class="library-note">Comparação editorial: os três modelos operam em planos diferentes e não representam um sistema integrado validado. As traduções das passagens são paráfrases resumidas de um modelo originalmente concebido para organizações com hierarquias formais.</p>
    </section>`;
  }
  function library(){setTitle('Biblioteca de liderança');return `<div class="shell"><section class="page-intro page-intro-grid"><div><span class="micro first-in">ACERVO DE REFERÊNCIAS</span><h1 class="serif page-title first-in" style="--delay:80ms">De onde vêm as ideias.</h1><p class="page-summary first-in" style="--delay:160ms">Uma biblioteca de apoio, com fontes acadêmicas, obras clássicas e autores contemporâneos. O hub interpreta as ideias; não reproduz integralmente os livros.</p></div><aside class="page-side first-in"><span class="side-label"><strong>${data.sources.length}</strong> fontes identificadas</span><p>Referências rastreáveis, organizadas por tema e tipo de material.</p></aside></section></div>
      <section class="block-section shell"><div class="block-head"><div>${label('OBRAS DE REFERÊNCIA')}<h2 class="serif section-title">Três livros.<br><em>Três perguntas.</em></h2></div><p>Uma base complementar para pensar propósito, relações e desenvolvimento de lideranças.</p></div>
        <div class="book-index">${data.lenses.map((l,i)=>`<article class="book-row" data-reveal><div class="book-record"><span class="micro">${ESC(l.label)}</span><h3>${ESC(l.name)}</h3><p class="book-author">${ESC(l.author)} · ${l.year}</p></div><p class="book-description">${ESC(l.argument)}</p><div class="book-links"><a target="_blank" rel="noopener noreferrer" href="${ESC(sourceMap[l.source].url)}">Sobre a obra ${arrow}</a><a target="_blank" rel="noopener noreferrer" href="${ESC(l.userPdf)}">${l.id==='pipeline'?'PDF indicado · acesso não confirmado':'Resumo Bookey · material enviado'} ${arrow}</a></div></article>`).join('')}</div>
        <div class="library-note"><b>Sobre os arquivos indicados:</b> os PDFs de <i>Comece pelo porquê</i> e <i>O monge e o executivo</i> enviados para este projeto são resumos de terceiros produzidos pela Bookey, não os textos integrais. O terceiro PDF do <i>Pipeline de liderança</i> não pôde ser acessado na verificação; a fundamentação foi conferida em referências do autor e do livro.</div>
      </section>
      ${modelsDiagram()}
      <section class="block-section shell" style="padding-top:20px"><div class="block-head"><div>${label('CATÁLOGO')}<h2 class="serif section-title">Encontre um<br><em>fundamento.</em></h2></div><p>Pesquise por autor, obra ou assunto e filtre o catálogo. Os links abrem fontes externas, quando disponíveis.</p></div>
        <div class="library-controls"><label class="visually-hidden" for="library-search">Pesquisar referências</label><input class="search-field" type="search" id="library-search" placeholder="Buscar autor, obra ou conceito..." value="${ESC(state.query)}">
          <label class="visually-hidden" for="library-topic">Filtrar trilha</label><select class="search-field" id="library-topic"><option value="todos">Todas as trilhas</option>${topics.map(t=>`<option value="${t.id}" ${state.filter===t.id?'selected':''}>${ESC(t.short)}</option>`).join('')}<option value="lentes" ${state.filter==='lentes'?'selected':''}>Três lentes</option></select>
          <label class="visually-hidden" for="library-kind">Tipo de fonte</label><select class="search-field" id="library-kind"><option value="todos">Todos os tipos</option>${[...new Set(data.sources.map(s=>s.type))].map(k=>`<option ${state.kind===k?'selected':''}>${ESC(k)}</option>`).join('')}</select></div><div class="library-count" id="source-count"></div><div id="source-results" aria-live="polite"></div>
        <p class="library-note">As conexões com autores são interpretações aplicadas às situações do hub. Uma referência sustenta o princípio relacionado, mas não deve ser confundida com validação científica das ferramentas editoriais da Koor.</p>
      </section>`;}
  function method(){setTitle('Manifesto e método');return `<div class="shell"><section class="page-intro page-intro-grid"><div><span class="micro first-in">SOBRE A KOOR</span><h1 class="serif page-title first-in" style="--delay:80ms">Coordenação é uma forma de responsabilidade.</h1><p class="page-summary first-in" style="--delay:160ms">A Koor parte de uma ideia simples: a qualidade da liderança aparece na forma como as pessoas conseguem trabalhar juntas quando o líder não está no centro de tudo.</p></div><aside class="page-side first-in"><span class="side-label"><strong>Koor.</strong> Nome e conceito</span><p>Do húngaro <i>koordinálás</i> — coordenação — e da sonoridade de <i>core</i>, núcleo.</p></aside></section></div>
    <section class="about-statement"><div class="shell about-grid"><div data-reveal>${label('O CONCEITO DA MARCA')}<h2>Um núcleo.<br><em>Muitas direções.</em></h2><p>O símbolo original da Koor combina um círculo sólido e um K recortado em espaço negativo. O núcleo dá estabilidade; uma diagonal ultrapassa o limite do círculo e aponta para fora. A composição sugere direção e desenvolvimento sem reduzir a marca a um clichê motivacional.</p><p>O nome é inspirado na ideia de coordenação e evoca foneticamente a palavra inglesa <i>core</i>. Trata-se de um conceito de marca, não de uma afirmação de origem etimológica literal do nome.</p></div><div class="about-logo" data-reveal>${brand('',true)}</div></div></section>
    <section class="block-section shell"><div class="block-head"><div>${label('QUATRO COMPROMISSOS')}<h2 class="serif section-title">O que orienta<br><em>o método.</em></h2></div><p>Compromissos operacionais para manter este conteúdo útil, honesto e aplicável.</p></div><div class="belief-list">${[['01','Clareza antes da cobrança.','Toda entrega precisa de objetivo, responsabilidade, limites e critério de qualidade.'],['02','Autonomia com apoio.','Delegação é um acordo de decisão e responsabilidade, não abandono.'],['03','Evidência antes da certeza.','Hipóteses devem ser nomeadas, escolhas explicadas e correções permitidas.'],['04','Coerência antes do discurso.','Valores só se tornam cultura quando aparecem em decisões repetidas.']].map(([n,h,p])=>`<div class="belief-row" data-reveal><span class="micro">${n}</span><h3>${h}</h3><p>${p}</p></div>`).join('')}</div></section>
    <section class="lens-section"><div class="shell"><div class="block-head"><div>${label('SOBRE ESTE CONTEÚDO')}<h2 class="serif section-title">O que é fonte.<br><em>O que é síntese.</em></h2></div><p>Separar referência, interpretação e recomendação evita falsas certezas e atribuições indevidas.</p></div><div class="source-method"><div data-reveal><span class="micro">FONTES CONSULTADAS</span><h3>Obra e pesquisa.</h3><p>Livros e artigos fundamentam noções como autonomia, segurança psicológica, negociação e julgamento sob incerteza. Links para registros e publicações estão na biblioteca.</p></div><div data-reveal><span class="micro">LEITURA E SÍNTESE</span><h3>Síntese pedagógica.</h3><p>As cinco trilhas traduzem ideias para contextos de liderança. As frases e exemplos não são citações literais dos autores.</p></div><div data-reveal><span class="micro">EXERCÍCIOS AUTORAIS</span><h3>Ferramenta própria.</h3><p>Ciclos, cenários, checklists e instrumentos do laboratório são construções didáticas Koor. Não são diagnósticos validados nem substituem políticas da organização.</p></div><div data-reveal><span class="micro">REVISÃO E CONTEXTO</span><h3>Julgamento humano.</h3><p>Nenhuma técnica substitui o contexto, a escuta de envolvidos ou a responsabilidade final por uma decisão e por seus efeitos.</p></div></div></div></section>
    <section class="block-section shell"><div class="home-quote" style="padding:65px 35px"><div class="quote-grid"><span class="micro">PARA SEGUIR ESTUDANDO</span><div><blockquote>Liderar não é ser <em>indispensável.</em><br>É tornar o time mais capaz.</blockquote><div class="quote-bottom"><p class="subline">Explore um fundamento, teste uma ação, revise o resultado.</p><a class="outline-link" href="#trilhas">Ver trilhas ${arrow}</a></div></div></div></div></section>`;}
  function render({preserve=false}={}){
    const before=window.scrollY;
    const r=route();
    nav();
    const header=document.querySelector('.site-header');
    if(header)document.documentElement.style.setProperty('--koor-header-h',header.offsetHeight+'px');
    if(r==='inicio')app.innerHTML=indexView();
    else if(r==='trilhas')app.innerHTML=tracksView();
    else if(r.startsWith('trilha/'))app.innerHTML=topicView(topic(r.split('/')[1])||topics[0]);
    else if(r==='laboratorio')app.innerHTML=laboratory();
    else if(r==='biblioteca')app.innerHTML=library();
    else if(r==='metodo')app.innerHTML=method();
    else{location.hash='#inicio';return;}
    footer();motion();
    if(r==='biblioteca')filterLibrary();
    if(r==='laboratorio')updateToolPreview();
    if(preserve)window.scrollTo({top:before,behavior:'auto'});
    else window.scrollTo({top:0,behavior:'auto'});
    progress();
  }
  function progress(){const node=document.getElementById('scroll-progress');if(!node)return;const max=document.documentElement.scrollHeight-innerHeight;node.style.transform=`scaleX(${max>0?Math.max(0,Math.min(1,scrollY/max)):0})`;}
  async function copyText(text){
    try{if(navigator.clipboard&&window.isSecureContext){await navigator.clipboard.writeText(text);toast('Texto copiado para a área de transferência.');return;}}catch{}
    const temp=document.createElement('textarea');temp.value=text;temp.style.position='fixed';temp.style.left='-9999px';document.body.appendChild(temp);temp.select();
    try{const ok=document.execCommand('copy');toast(ok?'Texto copiado para a área de transferência.':'Selecione e copie o texto exibido.');}catch{toast('Selecione e copie o texto exibido.');}finally{temp.remove();}
  }
  document.addEventListener('click',event=>{
    const anchor=event.target.closest('a[data-anchor]');
    if(anchor){event.preventDefault();const section=document.getElementById(anchor.dataset.anchor);section?.scrollIntoView({behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth',block:'start'});return;}
    const goto=event.target.closest('button[data-route]');if(goto){const destination=goto.dataset.route;if(route()===destination){window.scrollTo({top:0,behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth'});}else{location.hash='#'+destination;}return;}
    const selection=event.target.closest('button[data-lab]');if(selection){
      const next=selection.dataset.lab;
      if(next===state.labTool)return;
      state.labTool=next;
      document.querySelectorAll('[data-lab]').forEach(el=>{const active=el.dataset.lab===next;el.classList.toggle('is-active',active);el.setAttribute('aria-selected',String(active));el.querySelector('span').innerHTML=(active?'SELECIONADO':'ABRIR')+' '+arrow;});
      const panel=document.getElementById('lab-tool');
      if(panel){panel.innerHTML=labToolPanel();panel.setAttribute('aria-labelledby','tab-'+next);}
      updateToolPreview();
      document.getElementById('tab-'+next)?.focus({preventScroll:true});
      return;
    }
    const scenario=event.target.closest('button[data-scenario]');if(scenario){const id=scenario.dataset.scenario;const choice=Number(scenario.dataset.choice);const t=topic(id);if(!t)return;const choices=readChoices();choices[id]=choice;saveChoices(choices);document.querySelectorAll(`[data-scenario="${id}"]`).forEach(el=>{const active=Number(el.dataset.choice)===choice;el.classList.toggle('chosen',active);el.setAttribute('aria-pressed',String(active));});const result=document.getElementById('scenario-feedback-'+id);if(result)result.innerHTML=feedbackMarkup(t,choice);return;}
    const reset=event.target.closest('button[data-reset-plan]');if(reset){const t=topic(reset.dataset.resetPlan);const p=readProgress();p[t.id]=[];saveProgress(p);document.querySelectorAll(`input[data-plan="${t.id}"]`).forEach(el=>el.checked=false);document.getElementById('plan-aside-'+t.id).innerHTML=renderPlanAside(t);return;}
    const cp=event.target.closest('button[data-copy-plan]');if(cp){const t=topic(cp.dataset.copyPlan);copyText(`PLANO DE APLICAÇÃO — KOOR / ${t.short}\n\n`+t.plan.map(([day,h,d])=>`${day} — ${h}\n${d}`).join('\n\n')+`\n\nPergunta de reflexão: ${t.question}`);return;}
    if(event.target.closest('[data-copy-preview]')){copyText(document.getElementById('tool-preview')?.textContent||'');}
  });
  document.addEventListener('change',event=>{
    const plan=event.target.closest('input[data-plan]');if(plan){const t=topic(plan.dataset.plan);const i=Number(plan.dataset.step);const p=readProgress();const checked=new Set(p[t.id]||[]);if(plan.checked)checked.add(i);else checked.delete(i);p[t.id]=[...checked];saveProgress(p);const aside=document.getElementById('plan-aside-'+t.id);if(aside)aside.innerHTML=renderPlanAside(t);return;}
    if(event.target.id==='library-topic'){state.filter=event.target.value;filterLibrary();return;}
    if(event.target.id==='library-kind'){state.kind=event.target.value;filterLibrary();return;}
    if(event.target.hasAttribute('data-tool-field'))updateToolPreview();
  });
  document.addEventListener('input',event=>{if(event.target.id==='library-search'){state.query=event.target.value;filterLibrary();return;}if(event.target.hasAttribute('data-tool-field'))updateToolPreview();});
  window.addEventListener('hashchange',()=>render());
  window.addEventListener('resize',()=>{const h=document.querySelector('.site-header');if(h)document.documentElement.style.setProperty('--koor-header-h',h.offsetHeight+'px');},{passive:true});
  const motionPreference=matchMedia('(prefers-reduced-motion: reduce)');
  document.documentElement.classList.toggle('motion-enabled',!motionPreference.matches && 'IntersectionObserver' in window);
  motionPreference.addEventListener?.('change',e=>{document.documentElement.classList.toggle('motion-enabled',!e.matches && 'IntersectionObserver' in window);if(e.matches){app.querySelectorAll('[data-reveal]').forEach(n=>n.classList.add('shown'));}});
  window.addEventListener('scroll',progress,{passive:true});
  render();
})();

</script>
</body>
</html>
